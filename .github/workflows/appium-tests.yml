name: Appium Mobile 300 Automated Tests & Excel Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  appium-mobile-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node Dependencies
        run: npm install

      - name: Run 300 Appium Mobile Tests
        env:
          APPIUM_REPORT_FILE: "Appium_Mobile_300_Test_Report.xlsx"
        run: |
          python appium-tests/run_appium_tests_300.py

      - name: Upload Appium Excel Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium_Mobile_300_Test_Report
          path: Appium_Mobile_300_Test_Report.xlsx
          retention-days: 30
